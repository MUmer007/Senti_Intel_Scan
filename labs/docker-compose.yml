version: '3.8'
services:
  # 1. OWASP Juice Shop (Modern Node/Angular app, great for API & SPA crawling)
  juice-shop:
    image: bkimminich/juice-shop
    container_name: sentinelscan-juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 2. DVWA (Classic PHP/MySQL app, great for basic SQLi/XSS checks)
  dvwa:
    image: vulnerables/web-dvwa
    container_name: sentinelscan-dvwa
    ports:
      - "8080:80"
    restart: unless-stopped

  # 3. WebGoat (Java/Spring app, great for complex logic flaws)
  webgoat:
    image: webgoat/webgoat
    container_name: sentinelscan-webgoat
    ports:
      - "8081:8080"
    environment:
      - WEBGOAT_PORT=8080
      - WEBGOAT_HOST=0.0.0.0
    restart: unless-stopped
